<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Along</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--paper:#fffdf8;--ink:#1c1915;--muted:#6e675e;--line:#e4dccb;--green:#234e3a;--moss:#e7f0ea;--sand:#efe6d6;--bg:#efe8da;--shadow:0 10px 28px rgba(40,28,14,.12)}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{font-family:system-ui,sans-serif;background:#e4ddd0;color:var(--ink);display:flex;justify-content:center}
.stage{width:min(430px,100%);min-height:100dvh;position:relative;overflow:hidden;background:#dfe7d8}#map{position:absolute;inset:0 0 64px 0}
.topbar{position:absolute;top:0;left:0;right:0;z-index:500;padding:12px;display:flex;justify-content:space-between;pointer-events:none}.topbar>*{pointer-events:auto}
.title-card{background:rgba(255,253,248,.96);border-radius:16px;padding:9px 11px;box-shadow:var(--shadow)}.title-card h1{margin:0;font-size:17px}.title-card p{margin:2px 0 0;color:var(--muted);font-size:12px}
.dock{position:absolute;left:0;right:0;bottom:64px;z-index:500;display:flex;gap:8px;overflow-x:auto;padding:0 12px 8px}.mini{min-width:220px;border:0;text-align:left;font:inherit;background:var(--paper);border-radius:16px;padding:10px;box-shadow:var(--shadow);cursor:pointer}
.who{display:flex;gap:8px;align-items:center}.face{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;position:relative;flex:none}.dog{position:absolute;width:18px;height:18px;right:-4px;bottom:-2px;border-radius:50%;background:#c9a15b;border:2px solid #fff;font-size:10px;display:grid;place-items:center}
.nav{position:absolute;left:0;right:0;bottom:0;z-index:500;background:rgba(255,253,248,.96);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1fr;padding:8px}.nav button{border:0;background:transparent;font:inherit;color:var(--muted);font-weight:650;cursor:pointer}
.sheet{position:absolute;inset:0;z-index:800;background:var(--bg);overflow:auto;padding-bottom:24px}.pinbar{position:absolute;left:0;right:0;bottom:64px;z-index:700;background:rgba(255,253,248,.98);border-radius:22px 22px 0 0;padding:12px 14px 14px;max-height:62dvh;overflow:auto}
h2{margin:10px 16px 4px}.note{margin:4px 16px 12px;color:var(--muted);font-size:13.5px;line-height:1.45}.card{margin:0 16px 12px;background:#fffdf8;border-radius:18px;padding:14px}
label.field{display:block;margin:0 16px 10px}label.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}input{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit}
.seg{display:flex;flex-wrap:wrap;gap:8px}.seg button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;font:inherit;cursor:pointer}.seg button.on{border-color:var(--green);background:var(--moss)}
.cta,.ghost{border:0;border-radius:14px;padding:13px;font:inherit;font-weight:700;cursor:pointer}.cta{background:var(--green);color:#f6f1e7}.ghost{background:var(--sand)}
.photos{display:flex;gap:16px;padding:4px 16px 14px}.shot{border:0;background:transparent;font:inherit;cursor:pointer;text-align:center}.shot img{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid #fff}
.toast{position:absolute;left:12px;right:12px;bottom:78px;z-index:900;background:var(--ink);color:#fff;border-radius:14px;padding:12px;opacity:0}.toast.show{opacity:1}
</style></head><body><div class="stage"><div id="map"></div>
<div class="topbar"><div class="title-card"><h1>Along</h1><p>Out now, or starting within 30 min</p></div><button class="shot" onclick="openProfile()"><img id="meImg" alt=""></button></div>
<div class="dock" id="dock"></div>
<nav class="nav"><button onclick="closeSheet()">Nearby</button><button onclick="openGo()">Go out</button><button onclick="openProfile()">Profile</button></nav>
<div class="toast" id="toast"></div></div>
<script>
const plans=['Quick 10–15 min','Long walk, no rush','Coffee stop','Around the block'];
const svg=l=>`data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'><rect width='80' height='80' fill='%23234e3a'/><text x='40' y='50' text-anchor='middle' font-size='32' fill='white' font-family='sans-serif'>${l}</text></svg>`)}`;
let map,layer,draft,userHere=null;
let me={name:'',age:'',hasDog:null,dogName:'',breed:'',photo:svg('Y'),dogPhoto:svg('D'),out:null};
const people=[
{id:1,name:'Lena',photo:svg('L'),hasDog:true,dogName:'Otto',breed:'beagle',plan:plans[0],when:0,mode:'live',lat:48.2038,lng:16.3778,note:'Out now. Approximate area only.'},
{id:2,name:'Jonas',photo:svg('J'),hasDog:false,plan:'Coffee stop',when:20,mode:'pin',lat:48.2085,lng:16.3732,note:'No dog, just company. Pin stays.'},
{id:3,name:'Aylin',photo:svg('A'),hasDog:true,dogName:'Nori',breed:'retriever',plan:plans[1],when:10,mode:'pin',lat:48.2145,lng:16.3895,note:'Starting in 10. Pin is the meet point.'}
];
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}
function face(p){return `<span class="face" style="background:#234e3a">${p.name[0]}${p.hasDog?'<i class="dog">'+p.dogName[0]+'</i>':''}</span>`}
function whenLabel(n){return n?`Starts in ${n} min`:'Out now'}
function dogLabel(p){return p.hasDog?`${p.dogName}, ${p.breed}`:'No dog, just company'}
function iconFor(p){return L.divIcon({className:'',html:face(p),iconSize:[46,46],iconAnchor:[23,40]})}
function render(){if(!layer)return;layer.clearLayers();const list=people.slice();if(me.out)list.push({...me.out,you:true,name:me.name||'You',hasDog:me.hasDog,dogName:me.dogName,breed:me.breed,photo:me.photo});list.forEach(p=>{L.marker([p.lat,p.lng],{icon:iconFor(p)}).addTo(layer).on('click',()=>p.you?openMine():openPerson(p.id))});document.getElementById('dock').innerHTML=list.filter(p=>!p.you).map(p=>`<button class="mini" onclick="openPerson(${p.id})"><div class="who">${face(p)}<span><b>${p.name}</b><br>${whenLabel(p.when)} · ${p.plan}<br>${dogLabel(p)}</span></div></button>`).join('')||'<div class="mini"><b>No one out</b><span>Go out yourself. Plans only show for 30 minutes.</span></div>';document.getElementById('meImg').src=me.photo}
function closeSheet(){const s=document.getElementById('sheet');if(s)s.remove()}
function sheet(h){closeSheet();const el=document.createElement('div');el.className='sheet';el.id='sheet';el.innerHTML=h;document.querySelector('.stage').appendChild(el)}
function openPerson(id){const p=people.find(x=>x.id===id);map.flyTo([p.lat,p.lng],16);sheet(`<div style="padding:14px"><button class="ghost" onclick="closeSheet()">Back</button></div><h2>${p.name}</h2><p class="note">${whenLabel(p.when)}. ${p.mode==='live'?'Approximate while they are out.':'Pin stays put.'}</p><div class="card"><div class="who">${face(p)}<div><b>${dogLabel(p)}</b><div class="note">${p.note}</div></div></div></div><div style="padding:0 16px"><button class="cta" style="width:100%" onclick="askJoin()">Ask to come along</button></div>`)}
function askJoin(){if(!me.name||me.hasDog===null||Number(me.age)<18){openProfile();toast('Profile first. 18+.');return}closeSheet();toast('Asked. They can ignore it.')}
function openProfile(){sheet(`<div style="padding:14px"><button class="ghost" onclick="closeSheet()">Back</button></div><h2>Your profile</h2><p class="note">Your photo is the pin. Dog photo only if you are bringing one. 18+.</p><div class="photos"><button class="shot" onclick="document.getElementById('pfile').click()"><img id="pPrev" src="${me.photo}"><small>Your photo</small></button><button class="shot" id="dogShot" style="${me.hasDog?'':'display:none'}" onclick="document.getElementById('dfile').click()"><img id="dPrev" src="${me.dogPhoto}"><small>Dog photo</small></button></div><input id="pfile" hidden type="file" accept="image/*" onchange="setPhoto(this,'me')"><input id="dfile" hidden type="file" accept="image/*" onchange="setPhoto(this,'dog')"><label class="field"><span>Name</span><input id="pname" value="${me.name}"></label><label class="field"><span>Age</span><input id="page" type="number" min="18" value="${me.age}" placeholder="18+"></label><div class="seg" id="dogMode" style="margin:0 16px 10px"><button class="${me.hasDog===true?'on':''}" onclick="pickDog(true)">Bringing a dog</button><button class="${me.hasDog===false?'on':''}" onclick="pickDog(false)">No dog, just company</button></div><div id="dogFields" style="${me.hasDog?'':'display:none'}"><label class="field"><span>Dog name</span><input id="dname" value="${me.dogName}"></label><label class="field"><span>Breed</span><input id="breed" value="${me.breed}"></label></div><div style="padding:0 16px"><button class="cta" style="width:100%" onclick="saveProfile()">Save profile</button></div>`)}
function pickDog(v){me.hasDog=v;document.querySelectorAll('#dogMode button').forEach((b,i)=>b.classList.toggle('on',i===(v?0:1)));document.getElementById('dogFields').style.display=v?'':'none';document.getElementById('dogShot').style.display=v?'':'none'}
function setPhoto(input,kind){const f=input.files&&input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{if(kind==='me'){me.photo=r.result;document.getElementById('pPrev').src=me.photo;document.getElementById('meImg').src=me.photo}else{me.dogPhoto=r.result;document.getElementById('dPrev').src=me.dogPhoto}};r.readAsDataURL(f)}
function saveProfile(){me.name=document.getElementById('pname').value.trim();me.age=document.getElementById('page').value;if(me.hasDog){me.dogName=document.getElementById('dname').value.trim();me.breed=document.getElementById('breed').value.trim()}if(!me.name||me.hasDog===null){toast('Name, and dog or no dog.');return}if(Number(me.age)<18){toast('Along is 18+.');return}if(me.hasDog&&!me.dogName){toast('Name the dog.');return}closeSheet();toast('Profile saved.');render()}
function closePin(){const b=document.getElementById('pinbar');if(b)b.remove();if(draft){map.removeLayer(draft);draft=null}map.off('click',moveDraft)}
function moveDraft(e){if(draft&&me._mode!=='live')draft.setLatLng(e.latlng)}
function openGo(){if(!me.name||me.hasDog===null||Number(me.age)<18){openProfile();return}closeSheet();closePin();const here=userHere||map.getCenter();map.flyTo(here,16);me._mode='pin';draft=L.marker(here,{icon:iconFor({name:me.name||'You',hasDog:me.hasDog,dogName:me.dogName||'D'}),draggable:true}).addTo(map);map.on('click',moveDraft);const bar=document.createElement('div');bar.className='pinbar';bar.id='pinbar';bar.innerHTML=`<h2>Go out</h2><p class="note">Plan is the walk. Start is now, or up to 30 minutes ahead.</p><div class="seg" id="plans">${plans.map((p,i)=>`<button class="${i===0?'on':''}" data-v="${p}">${p}</button>`).join('')}</div><div class="seg" id="when" style="margin-top:8px"><button class="on" data-v="0">Now</button><button data-v="10">In 10</button><button data-v="20">In 20</button><button data-v="30">In 30</button></div><div class="seg" id="mode" style="margin-top:8px"><button class="on" data-v="pin">Pin stays here</button><button data-v="live">Live, approximate</button></div><p class="note" id="modeNote">You choose the spot. It will not follow you. Others see it only while you are out. 18+.</p><div style="display:flex;gap:8px"><button class="ghost" style="flex:1" onclick="closePin()">Cancel</button><button class="cta" style="flex:1" onclick="publish()">I’m out</button></div>`;document.querySelector('.stage').appendChild(bar);bar.querySelectorAll('.seg button').forEach(btn=>btn.onclick=()=>{btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');if(btn.parentElement.id==='mode'){me._mode=btn.dataset.v;document.getElementById('modeNote').textContent=me._mode==='live'?'Fuzzy area, only while you are out. Off when you end the walk.':'You choose the spot. It will not follow you.';if(draft)draft.dragging[me._mode==='live'?'disable':'enable']()}})}
function publish(){const ll=draft.getLatLng();me.out={lat:ll.lat,lng:ll.lng,plan:document.querySelector('#plans button.on').dataset.v,when:Number(document.querySelector('#when button.on').dataset.v),mode:document.querySelector('#mode button.on').dataset.v};closePin();render();toast(me.out.mode==='live'?'Approximate area on until you end the walk.':'Pin will not follow you.')}
function openMine(){sheet(`<div style="padding:14px"><button class="ghost" onclick="closeSheet()">Back</button></div><h2>You’re out</h2><p class="note">${me.out.plan}. ${whenLabel(me.out.when)}.</p><div style="padding:0 16px"><button class="ghost" style="width:100%" onclick="endWalk()">End walk</button></div>`)}
function endWalk(){me.out=null;closeSheet();render();toast('Off the map.')}
function boot(){map=L.map('map',{zoomControl:false}).setView([48.208,16.373],14);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);layer=L.layerGroup().addTo(map);render();if(navigator.geolocation)navigator.geolocation.getCurrentPosition(pos=>{userHere=[pos.coords.latitude,pos.coords.longitude];map.flyTo(userHere,15)},()=>{},{timeout:8000});openProfile()}
boot();
</script></body></html>
